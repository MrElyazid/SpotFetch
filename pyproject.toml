[project]
name = "spotfetch"
version = "1.0.0"
description = "A yt-dlp wrapper for downloading and tagging music"
readme = "README.md"
license = "GPL-2.0-or-later"
requires-python = ">=3.13"
dependencies = [
    "beets>=2.12.0",
    "certifi==2025.7.9",
    "charset-normalizer==3.4.2",
    "flask>=3.1.3",
    "idna==3.10",
    "markdown-it-py==3.0.0",
    "mdurl==0.1.2",
    "mutagen==1.47.0",
    "platformdirs>=4.11.7",
    "pygments==2.19.2",
    "requests==2.32.4",
    "rich==14.1.0",
    "urllib3==2.5.0",
    "yt-dlp[default]>=2026.8.19",
]
